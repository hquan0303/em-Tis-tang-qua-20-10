<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Chúc mừng 20/10</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500&family=Dancing+Script:wght@600&display=swap">
<style>
:root{--bg1:#fff4ef;--bg2:#e6f5ee;--bg3:#fde3ea;--b1:#bfe5d6;--b2:#f8bccb;--b3:#e3d6f7;--b4:#fff0c4;--ink:#23463b;--soft:#5d7f73;--rose:#e58aa0;--card:#fffdfc;
 box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light dark}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg1:#1d1a2b;--bg2:#10261f;--bg3:#2b1823;--b1:#1f5a47;--b2:#7a2f48;--b3:#3d2d6b;--b4:#5a4a1c;--ink:#e6f3ee;--soft:#a9c9bd;--card:#1d332b}}
:root[data-theme="dark"]{--bg1:#1d1a2b;--bg2:#10261f;--bg3:#2b1823;--b1:#1f5a47;--b2:#7a2f48;--b3:#3d2d6b;--b4:#5a4a1c;--ink:#e6f3ee;--soft:#a9c9bd;--card:#1d332b}
*,*::before,*::after{box-sizing:inherit}
html,body{margin:0}
body{background:linear-gradient(160deg,var(--bg1),var(--bg2) 55%,var(--bg3));color:var(--ink);font-family:'Be Vietnam Pro',system-ui,sans-serif;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:28px 16px 36px;overflow-x:hidden;position:relative;isolation:isolate}
.blob{position:fixed;border-radius:50%;filter:blur(55px);opacity:.75;z-index:-1;animation:drift 18s ease-in-out infinite alternate}
.blob.a{width:60vmax;height:60vmax;left:-20vmax;top:-18vmax;background:var(--b1)}
.blob.b{width:50vmax;height:50vmax;right:-18vmax;top:12vh;background:var(--b2);animation-duration:22s}
.blob.c{width:46vmax;height:46vmax;left:-10vmax;bottom:-20vmax;background:var(--b3);animation-duration:26s}
.blob.d{width:30vmax;height:30vmax;right:4vmax;bottom:-8vmax;background:var(--b4);animation-duration:20s}
@keyframes drift{to{transform:translate(8vmax,6vmax) scale(1.15)}}
.petals{position:fixed;inset:0;pointer-events:none;z-index:2;overflow:hidden}
.pt{position:absolute;top:-30px;border-radius:80% 0 80% 0;background:linear-gradient(135deg,#ffd3de,#f59db5);opacity:.85;animation:fall linear infinite}
@keyframes fall{to{transform:translate(var(--dx),110vh) rotate(var(--r))}}
.names{position:fixed;inset:0;pointer-events:none;z-index:2;overflow:hidden}
.nm{position:absolute;font-family:'Dancing Script','Segoe Script',cursive;font-weight:600;color:var(--rose);text-shadow:0 0 10px rgba(255,255,255,.8),0 1px 2px rgba(0,0,0,.12);white-space:nowrap;opacity:0;animation:nm linear infinite}
@keyframes nm{0%{transform:translate(0,12vh) rotate(var(--r));opacity:0}15%{opacity:.9}50%{transform:translate(var(--sx),-10vh) rotate(calc(var(--r) * -1))}85%{opacity:.9}100%{transform:translate(0,-34vh) rotate(var(--r));opacity:0}}
h1{font-family:'Dancing Script','Segoe Script',cursive;font-weight:600;font-size:clamp(2.4rem,9vw,3.6rem);line-height:1.1;margin:0;text-align:center}
.sub{margin:10px 0 0;color:var(--soft);text-align:center;font-size:.95rem;max-width:30ch;line-height:1.5}
.stage{position:relative;width:min(94vw,520px);aspect-ratio:1;margin-top:8px;container-type:size}
.fan{position:absolute;left:50%;top:80%;width:0;height:0}
.c{position:absolute;left:-9.75cqw;bottom:0;width:19.5cqw;padding:0;border:0;background:none;cursor:pointer;transform-origin:50% 100%;
 transform:rotate(var(--a)) translateY(var(--ty,0));transition:transform .25s ease;animation:bloom .8s cubic-bezier(.2,1.2,.4,1) backwards;animation-delay:var(--d)}
.c:hover,.c:focus-visible{--ty:-2.2cqw;z-index:9}
.c:focus-visible,.env:focus-visible{outline:none}
.c:focus-visible .ph{outline:3px solid var(--rose);outline-offset:2px}
.ph{display:block;position:relative;aspect-ratio:3/4;background:#fff;padding:1.1cqw;border-radius:.8cqw;box-shadow:0 1cqw 2.4cqw rgba(35,70,59,.28),0 0 0 .2cqw rgba(0,0,0,.06)}
.ph img{width:100%;height:100%;object-fit:cover;display:block;border-radius:.3cqw}
.fl{position:absolute;top:-4cqw;width:10cqw;height:10cqw;filter:drop-shadow(0 .4cqw .6cqw rgba(0,0,0,.25));pointer-events:none}
.st{display:block;position:relative;width:.9cqw;height:var(--s);margin:0 auto;background:linear-gradient(90deg,#6f9a55,#a9c98c 45%,#5d8647);border-radius:0 0 1cqw 1cqw}
.lf{position:absolute;width:5.5cqw;height:2.8cqw;background:linear-gradient(135deg,#9bc87f,#5a8a45);border-radius:0 100% 0 100%}
.l1{left:100%;bottom:28%;transform:rotate(-28deg);transform-origin:left bottom}
.l2{right:100%;bottom:52%;transform:scaleX(-1) rotate(-28deg);transform-origin:right bottom}
@keyframes bloom{from{transform:rotate(0) translateY(8cqw) scale(.35);opacity:0}}
.bow{position:absolute;left:37%;top:75%;width:26%;z-index:6;pointer-events:none;filter:drop-shadow(0 .6cqw .8cqw rgba(0,0,0,.22));animation:pop .6s ease 1.2s backwards}
.env{position:absolute;left:50%;top:74%;width:23cqw;height:15cqw;margin:-7.5cqw 0 0 -11.5cqw;padding:0;border:0;cursor:pointer;z-index:4;
 background:linear-gradient(160deg,#fffaf0,#f6e8d3);border-radius:1cqw;transform:rotate(-5deg);transition:transform .25s ease;
 filter:drop-shadow(0 1cqw 1.4cqw rgba(35,70,59,.3));animation:drop .7s cubic-bezier(.2,1.3,.4,1) 1.1s backwards}
.env:hover,.env:focus-visible{transform:rotate(-5deg) translateY(-1.5cqw)}
.env:focus-visible{box-shadow:0 0 0 3px var(--rose)}
.env::before{content:"";position:absolute;inset:0;background:linear-gradient(160deg,#fff,#f1dfc6);clip-path:polygon(0 0,100% 0,50% 62%);border-radius:1cqw 1cqw 0 0}
.env::after{content:"♥";position:absolute;left:50%;top:44%;width:5cqw;height:5cqw;margin:-2.5cqw 0 0 -2.5cqw;border-radius:50%;background:var(--rose);color:#fff;font-size:2.9cqw;line-height:5cqw;text-align:center;box-shadow:0 .3cqw .6cqw rgba(0,0,0,.25)}
@keyframes drop{from{transform:rotate(-5deg) translateY(-12cqw) scale(.6);opacity:0}}
.hint{color:var(--soft);font-size:.9rem;margin:6px 0 0;text-align:center}
#m{position:fixed;inset:0;background:rgba(14,30,24,.78);display:none;align-items:center;justify-content:center;padding:calc(16px + env(safe-area-inset-top,0px)) 16px calc(16px + env(safe-area-inset-bottom,0px));z-index:20}
#m.on{display:flex}
.card{background:var(--card);border-radius:20px;width:min(100%,440px);max-height:100%;overflow:auto;padding:12px 12px 18px;text-align:center;position:relative;animation:pop .35s ease both}
@keyframes pop{from{transform:scale(.85);opacity:0}to{transform:none;opacity:1}}
.card.lt{background:#fffaf0;color:#3b3226}.card.lt img,.card.lt .nav{display:none}.card.lt .wish{font-size:1.3rem;white-space:pre-line;text-align:left;margin:34px 16px 14px}
.card img{width:100%;max-height:60vh;object-fit:contain;border-radius:12px;display:block;background:#0001}
.wish{font-family:'Dancing Script','Segoe Script',cursive;font-size:1.55rem;line-height:1.35;margin:14px 8px 4px}
.nav{display:flex;justify-content:space-between;align-items:center;margin-top:10px;padding:0 6px;color:var(--soft);font-size:.85rem}
.nav button,.x{font:inherit;background:none;border:0;color:var(--ink);cursor:pointer;padding:8px 12px;border-radius:999px}
.nav button:hover,.x:hover{background:#7fb5a122}
.nav button:focus-visible,.x:focus-visible{outline:3px solid var(--rose)}
.x{position:absolute;top:6px;right:6px;z-index:2;background:#fffc;color:#23463b;font-size:1.1rem;line-height:1}
@media (prefers-reduced-motion:reduce){.c,.card,.blob,.pt,.nm{animation:none}.nm{opacity:.5}.petals{display:none}}
</style>
</head>

<div class="blob a"></div><div class="blob b"></div><div class="blob c"></div><div class="blob d"></div>
<div class="petals" id="petals" aria-hidden="true"></div>
<div class="names" id="names" aria-hidden="true"></div>
<h1>Chúc mừng 20/10</h1>
<p class="sub">Ngày Phụ nữ Việt Nam, gửi tặng bông hoa Hồng Anh 🩷.</p>
<div class="stage" id="stage">
  <div class="fan" id="fan"></div>
</div>
<p class="hint">Nhấp tay vào từng ảnh và thư nhé :3</p>

<div id="m" role="dialog" aria-modal="true" aria-label="Lời chúc">
  <div class="card">
    <button class="x" id="close" aria-label="Đóng">✕</button>
    <img id="big" alt="Ảnh trong bó hoa">
    <p class="wish" id="wish"></p>
    <div class="nav"><button id="prev">Trước</button><span id="cnt"></span><button id="next">Sau</button></div>
  </div>
</div>

var m=document.getElementById('m'),big=document.getElementById('big'),wish=document.getElementById('wish'),cnt=document.getElementById('cnt');
function show(i){m.querySelector('.card').classList.remove('lt');cur=(i+IMGS.length)%IMGS.length;big.src=IMGS[cur];wish.textContent=WISHES[cur];cnt.textContent=(cur+1)+' / '+IMGS.length}
function open(i,el){last=el;show(i);m.classList.add('on');document.getElementById('close').focus()}
function openLetter(el){last=el;m.querySelector('.card').classList.add('lt');wish.textContent=LETTER;m.classList.add('on');document.getElementById('close').focus()}
function close(){m.classList.remove('on');if(last)last.focus()}
document.getElementById('close').onclick=close;
document.getElementById('prev').onclick=function(){show(cur-1)};
document.getElementById('next').onclick=function(){show(cur+1)};
m.onclick=function(e){if(e.target===m)close()};
document.addEventListener('keydown',function(e){if(!m.classList.contains('on'))return;
 if(e.key==='Escape')close();if(m.querySelector('.lt'))return;if(e.key==='ArrowLeft')show(cur-1);if(e.key==='ArrowRight')show(cur+1)});

 N.appendChild(e)}

 P.appendChild(p)}
